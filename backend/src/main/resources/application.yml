server:
  port: ${PORT:8080}
  compression:
    enabled: true

spring:
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Origins allowed to open the WebSocket (comma separated patterns)
  allowed-origins: ${ALLOWED_ORIGINS:*}

# Only built-in Android tools are used (screenrecord + sendevent/input over adb); nothing is installed on the device.
emulator:
  native:
    rotation-poll-interval: 1s
    key-frame-cooldown: 1s
    frame-flush-delay: 2ms
  adb:
    path: ${ADB_PATH:adb}
    auto-connect: ${ADB_AUTO_CONNECT:}
  stream:
    max-size: ${STREAM_MAX_SIZE:1280}
    video-bit-rate: ${STREAM_BIT_RATE:8000000}
    idle-timeout: 10s
    viewer-queue-size: 30

logging:
  level:
    io.androidemul: INFO
